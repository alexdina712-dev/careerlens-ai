services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: careerlens
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: careerlens
    ports:
      - '127.0.0.1:54330:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U careerlens -d careerlens']
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    ports:
      - '127.0.0.1:4001:4001'
    environment:
      DATABASE_URL: postgresql://careerlens:local_dev_only@db:5432/careerlens
      APP_ORIGIN: http://127.0.0.1:4001
      # HTTP localhost demo: secure cookies are disabled only in this dev profile.
      NODE_ENV: development
      SERVE_WEB: 'true'
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
